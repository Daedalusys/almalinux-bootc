---
name: build-kitten

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

env:
  IMAGE_NAME: almalinux-bootc
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: daedalusys

jobs:
  set-versions-matrix:
    name: Set versions matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          echo 'matrix=["10-kitten"]' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.VERSION_MAJOR }} ${{ matrix.ARCH }}
    needs: [set-versions-matrix]
    runs-on: ${{ matrix.ARCH == 'arm64' && 'ubuntu-24.04-arm'
        || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        VERSION_MAJOR: ${{ fromJSON(
            needs.set-versions-matrix.outputs.matrix) }}
        ARCH: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PLATFORM: linux/${{ matrix.ARCH }}
      VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Build image
        run: |
          set -euxo pipefail
          sudo podman build \
            --platform="${PLATFORM}" \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --tag localhost/${IMAGE_NAME}:${VERSION_MAJOR}-${ARCH} \
            -f ${VERSION_MAJOR}/Containerfile \
            .
        env:
          ARCH: ${{ matrix.ARCH }}

      # Rechunk (OSTree chunking optimization) deferred: podman --manifest
      # across containers fails with 'locating item named "manifest-sha256:..."'
      # because the rechunk container's view of containers-storage differs
      # from the build container's. The image is bootc-valid without rechunk;
      # chunking is an optimization. Re-enable after fixing storage sharing.

      # headless guarantees gate: "no GUI package in the image" and
      # "rescue path usable". amd64 only: arm64 needs QEMU emulation, which is
      # slow and prone to false positives. Placed before the push — an image
      # that fails the gate does not reach the registry.
      - name: Install just (headless gate)
        if: matrix.ARCH == 'amd64'
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y just
          fi
          just --version

      - name: Verify headless invariants (amd64 only)
        if: matrix.ARCH == 'amd64'
        env:
          ARCH: ${{ matrix.ARCH }}
        run: |
          set -euo pipefail
          IMG="localhost/${IMAGE_NAME}:${VERSION_MAJOR}-${ARCH}"

          # Layer 1: manifest scan. Needs no container, runs on any runner,
          # and is always a gate.
          just verify-headless-manifest

          # Layer 2: image probes. Needs a runner CPU with x86-64-v3 support
          # (AlmaLinux 10 glibc hard requirement). Probe the capability first:
          # on a runner without it, skip this layer with a warning instead of
          # turning CI into a noise source.
          if ! probe_out=$(sudo env "PATH=$PATH" \
              podman run --rm "$IMG" rpm --version 2>&1); then
            echo "$probe_out" | head -5
            if echo "$probe_out" | grep -q 'CPU does not support x86-64'; then
              echo "::warning::runner CPU lacks x86-64-v3, skipping probes"
              exit 0
            fi
            # not a CPU instruction set issue — the image itself is broken
            echo "::error::image cannot run, headless probes impossible"
            exit 1
          fi

          sudo env "PATH=$PATH" IMAGE="$IMG" just verify-headless

      - name: Login to ghcr.io
        if: github.event_name != 'schedule'
        uses: docker/login-action@d3b9cdfa580156c018ca5e745c1bf653d8ea46b5
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-arch image
        if: github.event_name != 'schedule'
        env:
          ARCH: ${{ matrix.ARCH }}
          REGISTRY_AUTH_FILE: ~/.docker/config.json
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          sudo podman push \
            --digestfile=/tmp/digest-${VERSION_MAJOR}-${ARCH} \
            --authfile ~/.docker/config.json \
            "localhost/${IMAGE_NAME}:${VERSION_MAJOR}-${ARCH}" \
            "docker://${IMAGE_DEST}:${VERSION_MAJOR}-${ARCH}"

      - name: Upload digest for signing job
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.VERSION_MAJOR }}-${{ matrix.ARCH }}
          path: /tmp/digest-${{ matrix.VERSION_MAJOR }}-${{ matrix.ARCH }}
          retention-days: 1

  # The two headless guarantees as their own job: an independent red dot in
  # the GitHub UI, usable as a required check, and a durable answer to "was
  # the image we published actually verified?". No overlap with the gate in
  # the build job: that one probes the freshly built local image (before the
  # push), this one probes the tag that was actually published.
  verify-headless:
    name: Verify headless invariants
    runs-on: ubuntu-24.04
    needs: [set-versions-matrix, build]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        VERSION_MAJOR: ${{ fromJSON(
            needs.set-versions-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install just + podman
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y just
          fi
          sudo apt-get update -y
          sudo apt-get install -y podman

      - name: Login to ghcr.io
        uses: docker/login-action@d3b9cdfa580156c018ca5e745c1bf653d8ea46b5
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify (manifest static + published image)
        run: |
          set -euo pipefail
          IMG="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:${VERSION_MAJOR}-amd64"
          sudo podman pull "$IMG"

          # Layer 1: manifest scan. Needs no container, runs on any runner.
          just verify-headless-manifest

          # Layer 2: image probes. Needs a runner CPU with x86-64-v3 support.
          # Probe the capability first: on a runner without it, skip this layer
          # with a warning instead of turning CI into a noise source.
          if ! probe_out=$(sudo env "PATH=$PATH" \
              podman run --rm "$IMG" rpm --version 2>&1); then
            echo "$probe_out" | head -5
            if echo "$probe_out" | grep -q 'CPU does not support x86-64'; then
              echo "::warning::runner CPU lacks x86-64-v3, skipping probes"
              exit 0
            fi
            # not a CPU instruction set issue — the image itself is broken
            echo "::error::image cannot run, headless probes impossible"
            exit 1
          fi

          sudo env "PATH=$PATH" IMAGE="$IMG" just verify-headless

  # live section (Probe 6): boot a full systemd, verify sshd really is active
  # and that no GUI unit file exists. Rare but valuable: manual trigger and
  # weekly cron only, never on every push. Environment sensitive (systemd in a
  # container), so it is not a merge gate: continue-on-error keeps a flaky red
  # from blocking a release — but every red result needs a look, and repeated
  # reds mean a real regression.
  verify-headless-live:
    name: Verify headless rescue path (live)
    runs-on: ubuntu-24.04
    needs: [set-versions-matrix, build]
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
        || github.event_name == 'schedule'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        VERSION_MAJOR: ${{ fromJSON(
            needs.set-versions-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install just + podman
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y just
          fi
          sudo apt-get update -y
          sudo apt-get install -y podman

      - name: Login to ghcr.io
        uses: docker/login-action@d3b9cdfa580156c018ca5e745c1bf653d8ea46b5
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Live probe
        run: |
          set -euo pipefail
          IMG="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:${VERSION_MAJOR}-amd64"
          sudo podman pull "$IMG"
          sudo env "PATH=$PATH" IMAGE="$IMG" RESCUE_SSH_PORT=22022 \
            just verify-headless-live

  sign-and-manifest:
    name: Sign + manifest
    needs: [set-versions-matrix, build]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        VERSION_MAJOR: ${{ fromJSON(
            needs.set-versions-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07

      - name: Install podman
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download all per-arch digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: /tmp/digests
          merge-multiple: true

      - name: Login to ghcr.io
        uses: docker/login-action@d3b9cdfa580156c018ca5e745c1bf653d8ea46b5
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign per-arch with cosign
        env:
          VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          for arch in amd64 arm64; do
            digest=$(cat "/tmp/digests/digest-${VERSION_MAJOR}-${arch}")
            cosign sign --yes "${IMAGE_DEST}@${digest}"
          done

      - name: Create + push manifest list
        env:
          VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY_AUTH_FILE: ~/.docker/config.json
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          sudo podman manifest create "${IMAGE_DEST}:${VERSION_MAJOR}"
          for arch in amd64 arm64; do
            digest=$(cat "/tmp/digests/digest-${VERSION_MAJOR}-${arch}")
            sudo podman manifest add \
              "${IMAGE_DEST}:${VERSION_MAJOR}" \
              "${IMAGE_DEST}@${digest}" \
              --arch "$arch"
          done
          sudo podman manifest push \
            --all=false \
            --authfile ~/.docker/config.json \
            --digestfile=/tmp/manifest-digest-${VERSION_MAJOR} \
            "${IMAGE_DEST}:${VERSION_MAJOR}" \
            "docker://${IMAGE_DEST}:${VERSION_MAJOR}"

      - name: Sign manifest list
        env:
          VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          digest=$(cat /tmp/manifest-digest-${VERSION_MAJOR})
          cosign sign --yes "${IMAGE_DEST}@${digest}"
